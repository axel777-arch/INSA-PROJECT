# Render Blueprint: creates the API (Docker) and the PostgreSQL database together.
services:
  - type: web
    name: agri-insight-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agri-insight-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: agri-insight-db
    plan: free
    databaseName: agri_insight
    user: agri_user
