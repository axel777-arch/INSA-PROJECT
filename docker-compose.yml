services:
  postgres:
    image: postgres:16
    container_name: agri-insight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agri_insight
      POSTGRES_USER: agri_user
      POSTGRES_PASSWORD: agri_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
