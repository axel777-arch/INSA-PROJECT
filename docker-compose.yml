services:
  postgres:
    image: postgres:16
    container_name: agri-insight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agri_insight
      POSTGRES_USER: agri_user
      POSTGRES_PASSWORD: agri_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri-insight-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://agri_user:agri_password@postgres:5432/agri_insight
      - JWT_ACCESS_SECRET=super_secret_jwt_access_key_that_is_at_least_32_characters_long
    depends_on:
      - postgres
volumes:
  postgres_data:
